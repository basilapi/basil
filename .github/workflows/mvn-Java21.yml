name: Maven build with Java 21

on:
  push:
    branches: [ v1.0-DEV ]
  pull_request:
    branches: [ v1.0-DEV ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Clean, install, and test
        run: mvn clean install