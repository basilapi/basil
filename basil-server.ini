#
# BASIL configuration (TDB2 backend)
#
# Run with:
#   java -jar -Dbasil.configurationFile=./basil-server.ini -Dlog4j.configurationFile=./log4j2.xml basil-server-VERSION.jar -p 8080
#
basil = io.github.basilapi.basil.server.BasilConfiguration
# Namespace used for the URIs of APIs, users and views stored by BASIL
basil.namespace = http://basilapi.github.io/data/ns/
# Folder where BASIL stores its data (created if missing)
basil.tdbLocation = ./basil-data
#
# Authentication against the TDB2 store
tdb2Realm = io.github.basilapi.basil.server.ShiroRealm
tdb2Realm.basilConfiguration = $basil
#
# ------------------------------------------------------
# SHIRO specific (do not touch!)
#
passwordMatcher = org.apache.shiro.authc.credential.PasswordMatcher
passwordService = org.apache.shiro.authc.credential.DefaultPasswordService
passwordMatcher.passwordService = $passwordService

securityManager.realms = $tdb2Realm
sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
securityManager.sessionManager = $sessionManager

